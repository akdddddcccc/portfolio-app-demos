name: Validate app demos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.11.0
      - run: npm ci
      - run: node scripts/install-all.mjs
      - run: npm test
      - run: node scripts/build-all.mjs
